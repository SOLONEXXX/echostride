<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECHOSTRIDE — Design Gallery</title>
<style>
  :root { --bone:#EDE6DA; --ash:#9A958C; --void:#0B0C10; --flux:#39D7E0; --echo:#8B6CF0; --oxide:#E4572E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--void); }
  /* One WebGL canvas for the whole page, pinned behind the content. Each card
     is a transparent hole that the shared renderer draws into via scissor.
     Seventeen separate renderers exceeded the browser's WebGL context limit
     and the earliest cards silently went blank. */
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  body {
    position: relative; z-index: 1;
    background: transparent; color: var(--bone); min-height: 100%;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .08em; padding: 34px;
  }
  h1 { font-size: 26px; letter-spacing: .3em; font-weight: 400; margin-bottom: 4px; }
  h1 .a { color: var(--flux); } h1 .b { color: var(--echo); }
  .sub { color: var(--ash); font-size: 11px; margin-bottom: 30px; }
  h2 { font-size: 11px; letter-spacing: .34em; color: var(--flux); font-weight: 400;
       margin: 34px 0 14px; border-bottom: 1px solid rgba(237,230,218,.14); padding-bottom: 7px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 18px; }
  .card { border: 1px solid rgba(237,230,218,.14); background: transparent; }
  .card .slot { display: block; width: 100%; height: 230px; }
  .card .cap { padding: 9px 11px; border-top: 1px solid rgba(237,230,218,.1);
               background: #0E1015; }
  .card .n { font-size: 11.5px; }
  .card .r { font-size: 9.5px; color: var(--ash); margin-top: 2px; }
  .card .s { font-size: 9.5px; color: var(--echo); margin-top: 5px; }
  .wide { grid-column: 1 / -1; }
  .wide .slot { height: 620px; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <h1><span class="a">ECHO</span><span class="b">STRIDE</span> · DESIGN GALLERY</h1>
  <div class="sub">Every model below is the exact geometry the game renders. Nothing here is concept art.</div>
  <div id="out"></div>
  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
